<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SoftwareDevCo</title>

  <meta
    name="description"
    content="SoftwareDevCo builds modern software, automation and digital solutions."
  >

  <!-- Load the logo as early as possible -->
  <link
    rel="preload"
    href="./assets/logo.png"
    as="image"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <link
    rel="stylesheet"
    href="./css/loader.css"
  >

  <link
    rel="stylesheet"
    href="./css/navigation.css"
  >

  <link
    rel="stylesheet"
    href="./css/responsive.css"
  >
</head>

<body class="is-loading">

  <!-- ========================================================
       LOADING SCREEN
       ======================================================== -->

  <div
    class="site-loader"
    id="loader"
    aria-label="Loading SoftwareDevCo"
  >

    <div
      class="loader-logo-shell"
      id="loaderLogo"
    >

      <!-- Dark, unpowered logo -->
      <img
        src="./assets/logo.png"
        class="loader-logo loader-logo-base"
        alt=""
        aria-hidden="true"
      >

      <!-- Metallic logo filling from bottom to top -->
      <div class="loader-fill">

        <img
          src="./assets/logo.png"
          class="loader-logo loader-logo-metal"
          alt="SoftwareDevCo"
        >

      </div>

      <!-- Internal metallic movement -->
      <div
        class="loader-energy"
        aria-hidden="true"
      ></div>

    </div>

  </div>


  <!-- ========================================================
       MAIN WEBSITE
       ======================================================== -->

  <main
    class="site"
    id="site"
  >

    <!-- ======================================================
         NAVIGATION
         ====================================================== -->

    <header class="top-nav">

      <nav
        class="nav-left"
        aria-label="Primary navigation"
      >

        <a href="#company">
          Our Company
        </a>

        <a href="#expertise">
          Expertise
        </a>

      </nav>


      <!--
        This is the final destination for the loader logo.

        JavaScript measures this image and moves the loader logo
        into exactly the same position and size.
      -->

      <a
        href="#company"
        class="center-logo"
        id="navLogo"
        aria-label="SoftwareDevCo home"
      >

        <img
          src="./assets/logo.png"
          alt="SoftwareDevCo"
        >

      </a>


      <nav
        class="nav-right"
        aria-label="Project navigation"
      >

        <a
          href="#start-project"
          class="start-project"
        >
          Start a Project
          <span aria-hidden="true">↗</span>
        </a>

      </nav>

    </header>


    <!-- ======================================================
         HERO
         ====================================================== -->

    <section
      class="hero"
      id="company"
    >

      <div
        class="grid-lines"
        aria-hidden="true"
      ></div>

      <div
        class="curve curve-one"
        aria-hidden="true"
      ></div>

      <div
        class="curve curve-two"
        aria-hidden="true"
      ></div>


      <div class="hero-inner">

        <h1
          class="hero-title reveal"
          style="--d: 0.2s;"
        >
          <span class="line">
            Engineering
          </span>

          <span class="line">
            what comes next.
          </span>
        </h1>


        <p
          class="hero-sub reveal"
          style="--d: 0.35s;"
        >
          Modern software, automation and digital solutions engineered
          for organisations ready to move forward.
        </p>


        <div
          class="hero-actions reveal"
          style="--d: 0.5s;"
        >

          <a
            href="#start-project"
            class="btn-primary"
          >
            Start a Project
            <span aria-hidden="true">↗</span>
          </a>


          <a
            href="#expertise"
            class="btn-ghost"
          >
            Our Expertise
          </a>

        </div>

      </div>


      <div
        class="hero-footer reveal"
        style="--d: 0.65s;"
      >

        <span class="mono-tag">
          We Build What's Next
        </span>

      </div>

    </section>

  </main>


  <script src="./js/main.js"></script>

</body>

</html>
