<svg
  id="brand-logo"
  class="logo-loader"
  width="338" height="238"
  viewBox="161 102 199 142"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Logo — Loader Animation (premium)</title>

  <!--
    USAGE
    ─────
    1. On mount, the logo is already visible in a faint grey "unfilled" state
       (#logo-base, low opacity) — nothing to trigger, it's just there.
    2. Add class "is-revealing" to #brand-logo to start the metallic
       bottom-to-top fill (drives .reveal-rect's transform: scaleY).
       Straight vertical wipe only — no top-to-bottom motion, no sweep, no glow.
    3. Listen for 'animationend' on .reveal-rect, then add class "is-docked"
       to #brand-logo and let your own nav-position transform take over.

    Example JS:
      const logo = document.getElementById('brand-logo');
      logo.classList.add('is-revealing');
      logo.querySelector('.reveal-rect').addEventListener('animationend', () => {
        logo.classList.add('is-docked');
      });
  -->

  <defs>
    <!-- Locked geometry -->
    <path id="geo-left"  d="M230,117 L176,148 L176,196 L229,227 L235,228 L235,206 L197,183 L197,159 L235,135 L236,119 Z"/>
    <path id="geo-slash" d="M277,117 L265,117 L263,121 L247,224 L249,228 L259,228 L261,226 L277,128 Z"/>
    <circle id="geo-dot" cx="230.5" cy="172" r="11.5"/>
    <path id="geo-right" d="M292,117 L287,117 L286,133 L290,138 L325,159 L325,184 L287,207 L286,227 L288,229 L337,202 L345,195 L344,147 Z"/>

    <g id="symbol-paths">
      <use href="#geo-left"/>
      <use href="#geo-slash"/>
      <use href="#geo-dot"/>
      <use href="#geo-right"/>
    </g>

    <clipPath id="clip-left"><use href="#geo-left"/></clipPath>
    <clipPath id="clip-slash"><use href="#geo-slash"/></clipPath>
    <clipPath id="clip-dot"><use href="#geo-dot"/></clipPath>
    <clipPath id="clip-right"><use href="#geo-right"/></clipPath>

    <linearGradient id="steelDiag" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#F7F7F7"/>
      <stop offset="30%"  stop-color="#D7D7D7"/>
      <stop offset="55%"  stop-color="#B5B5B5"/>
      <stop offset="80%"  stop-color="#8E8E8E"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>

    <radialGradient id="hiSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="premiumSteel" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.9" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="luminanceToAlpha" result="noiseAlpha"/>
      <feComponentTransfer in="noiseAlpha" result="grain">
        <feFuncA type="linear" slope="0.10" intercept="0"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="grain" operator="in" result="grainWhite"/>
      <feBlend in="SourceGraphic" in2="grainWhite" mode="overlay" result="textured"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.5" specularExponent="20" lighting-color="#ffffff" result="spec">
        <fePointLight x="185" y="65" z="210"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="textured" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="0.45" k4="0" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="1.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <mask id="revealMask" maskUnits="userSpaceOnUse" x="161" y="102" width="199" height="142">
      <rect class="reveal-rect" x="161" y="102" width="199" height="142" fill="#ffffff"/>
    </mask>
  </defs>

  <style>
    .reveal-rect {
      transform-box: fill-box;
      transform-origin: bottom center;
      transform: scaleY(0);
    }
    .logo-loader.is-revealing .reveal-rect {
      animation: reveal-up 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes reveal-up {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    .logo-loader.is-docked {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>

  <!-- faint, always-visible base state -->
  <use href="#symbol-paths" fill="#6b6b6b" opacity="0.28"/>

  <!-- metallic premium fill, revealed bottom-to-top by the mask -->
  <g mask="url(#revealMask)">
    <g id="left-bracket"><use href="#geo-left" fill="url(#steelDiag)" filter="url(#premiumSteel)"/></g>
    <g id="slash"><use href="#geo-slash" fill="url(#steelDiag)" filter="url(#premiumSteel)"/></g>
    <g id="dot"><use href="#geo-dot" fill="url(#steelDiag)" filter="url(#premiumSteel)"/></g>
    <g id="right-bracket"><use href="#geo-right" fill="url(#steelDiag)" filter="url(#premiumSteel)"/></g>

    <g id="highlights">
      <g clip-path="url(#clip-left)"><circle cx="190" cy="132" r="34" fill="url(#hiSpot)" style="mix-blend-mode:screen"/></g>
      <g clip-path="url(#clip-slash)"><circle cx="267" cy="128" r="20" fill="url(#hiSpot)" style="mix-blend-mode:screen"/></g>
      <g clip-path="url(#clip-dot)"><circle cx="227" cy="168" r="6" fill="url(#hiSpot)" style="mix-blend-mode:screen"/></g>
      <g clip-path="url(#clip-right)"><circle cx="297" cy="132" r="34" fill="url(#hiSpot)" style="mix-blend-mode:screen"/></g>
    </g>

    <g id="shadows">
      <g clip-path="url(#clip-left)"><circle cx="222" cy="212" r="28" fill="url(#shSpot)"/></g>
      <g clip-path="url(#clip-slash)"><circle cx="255" cy="215" r="20" fill="url(#shSpot)"/></g>
      <g clip-path="url(#clip-dot)"><circle cx="234" cy="177" r="6" fill="url(#shSpot)"/></g>
      <g clip-path="url(#clip-right)"><circle cx="330" cy="212" r="28" fill="url(#shSpot)"/></g>
    </g>
  </g>
</svg>
